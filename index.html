<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネイル予約デモ</title>
<style>
body { font-family: sans-serif; text-align: center; padding: 20px; }
button { padding: 15px; margin: 10px; font-size: 18px; width: 80%; }
.hidden { display: none; }
.calendar button { width: 30%; }
</style>
</head>

<body>

<h2 id="title">メニューを選択</h2>

<!-- メニュー -->
<div id="menu">
  <button onclick="goCalendar('ワンカラー')">ワンカラー</button>
  <button onclick="goCalendar('デザイン')">デザイン</button>
</div>

<!-- カレンダー -->
<div id="calendar" class="hidden">
  <h3>日時を選択</h3>
  <div class="calendar">
    <button onclick="complete('10:00')">10:00 ◯</button>
    <button onclick="complete('11:00')">11:00 ◯</button>
    <button onclick="complete('12:00')">12:00 ◯</button>
  </div>
</div>

<!-- 完了 -->
<div id="complete" class="hidden">
  <h3>予約を受け付けました</h3>
  <p>現在仮予約となっております。<br>確認後ご連絡いたします。</p>
</div>

<script>
function goCalendar(menu){
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("calendar").classList.remove("hidden");
  document.getElementById("title").innerText = menu + " を選択中";
}

function complete(time){
  document.getElementById("calendar").classList.add("hidden");
  document.getElementById("complete").classList.remove("hidden");
}
</script>

</body>
</html>
