<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネイル予約</title>

<style>
body {
  font-family: sans-serif;
  background: #fff0f5;
  text-align: center;
  margin: 0;
  padding: 20px;
}

h1 { font-size: 22px; margin-bottom: 5px; }
.sub { color: #777; font-size: 14px; margin-bottom: 20px; }

.card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

button {
  width: 90%;
  padding: 14px;
  margin: 8px 0;
  font-size: 15px;
  border: none;
  border-radius: 10px;
  background: #ff69b4;
  color: white;
}

.small-btn {
  background: #ddd;
  color: #333;
}

.time-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.time-btn {
  background: #f06292;
}

.hidden { display: none; }

.complete {
  font-size: 18px;
  color: #333;
}
</style>
</head>

<body>

<h1>ネイル予約</h1>
<div class="sub">LINEで簡単に予約できます</div>

<div class="card">

<!-- メニュー -->
<div id="menu">
  <h3>メニューを選択</h3>
  <button onclick="goCalendar('ワンカラー')">ワンカラー</button>
  <button onclick="goCalendar('デザイン')">デザイン</button>
</div>

<!-- カレンダー -->
<div id="calendar" class="hidden">
  <h3 id="selectedMenu"></h3>
  <p>日時を選択してください</p>

  <div class="time-grid">
    <button class="time-btn" onclick="complete('7/10 10:00')">7/10 10:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 11:00')">7/10 11:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 12:00')">7/10 12:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 13:00')">7/10 13:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 14:00')">7/10 14:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 15:00')">7/10 15:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 16:00')">7/10 16:00 ◯</button>
    <button class="time-btn" onclick="complete('7/10 17:00')">7/10 17:00 ◯</button>
  </div>

  <button class="small-btn" onclick="backToMenu()">← 戻る</button>
</div>

<!-- 完了 -->
<div id="complete" class="hidden">
  <div class="complete">
    予約を受け付けました 💅<br><br>
    現在仮予約となっております。<br>
    確認後ご連絡いたします。
  </div>

  <button class="small-btn" onclick="reset()">トップに戻る</button>
</div>

</div>

<script>
function goCalendar(menu){
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("calendar").classList.remove("hidden");
  document.getElementById("selectedMenu").innerText = menu;
}

function complete(time){
  document.getElementById("calendar").classList.add("hidden");
  document.getElementById("complete").classList.remove("hidden");
}

function backToMenu(){
  document.getElementById("calendar").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}

function reset(){
  document.getElementById("complete").classList.add("hidden");
  document.getElementById("menu").classList.remove("hidden");
}
</script>

</body>
</html>
