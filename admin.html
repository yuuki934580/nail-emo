<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>管理画面｜ネイルサロン</title>
<style>
:root {
  --rose:   #e8a4b8;
  --rose-d: #cc7a96;
  --rose-l: #fdf0f4;
  --cream:  #fdfaf8;
  --ink:    #2e1f27;
  --muted:  #a08898;
  --border: #eedde5;
  --green:  #4caf7d;
  --green-l:#e8f5e9;
  --red:    #e57373;
  --red-l:  #fdecea;
  --r:  14px;
  --rs: 10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  background:#f4f0f2;
  color:var(--ink);
  min-height:100vh;
}

/* ===== PC レイアウト ===== */
.layout{
  max-width:960px;
  margin:0 auto;
  padding-bottom:48px;
}

/* PC: 2カラム（サイドバー＋メイン） */
@media (min-width: 768px) {
  .hd{ padding:20px 32px 16px; }
  .nav{ padding:0 32px; }
  .pc-cols{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:24px;
    padding:24px 32px 0;
    align-items:start;
  }
  /* サイドバー：タブをverticalに */
  .nav{ display:none; } /* 横ナビ非表示 */
  .sidebar{
    display:flex;flex-direction:column;gap:4px;
    background:#fff;border-radius:14px;
    padding:12px;
    box-shadow:0 2px 12px rgba(58,42,48,.07);
    position:sticky;top:20px;
  }
  .sidebar-btn{
    display:block;width:100%;
    padding:12px 14px;
    font-size:13px;font-weight:700;
    background:none;border:none;
    color:var(--muted);text-align:left;
    border-radius:10px;cursor:pointer;
    transition:all .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .sidebar-btn:hover{background:#faf7f8;}
  .sidebar-btn.active{background:var(--rose-l);color:var(--rose-d);}
  .main-area{ min-width:0; }
  .sec{ padding:0 0 0; }
  .sec-hd{ padding-top:0; }
  .summary-grid{ padding:0 0 16px; }
}

/* スマホ：従来通り */
@media (max-width: 767px) {
  .layout{ max-width:480px;margin:0 auto; }
  .sidebar{ display:none; }
  .pc-cols{ display:block; }
  .sec{ padding:16px 16px 0; }
  .summary-grid{ padding:16px; }
}

/* ===== HEADER ===== */
.hd{
  background:linear-gradient(135deg,#3a2a30 0%,#5a3a48 100%);
  padding:20px 20px 16px;
  position:relative;overflow:hidden;
}
.hd::before{content:'';position:absolute;top:-30px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,.06);border-radius:50%;}
.hd-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.hd-name{font-size:17px;font-weight:800;color:#fff;letter-spacing:.05em;}
.hd-badge{font-size:10px;background:rgba(232,164,184,.25);color:var(--rose);border:1px solid rgba(232,164,184,.3);border-radius:20px;padding:3px 10px;font-weight:600;}
.hd-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:5px;position:relative;z-index:1;}

/* ===== NAV ===== */
.nav{
  display:flex;background:#fff;
  border-bottom:2px solid var(--border);
  overflow-x:auto;
}
.nav::-webkit-scrollbar{display:none;}
.nav-btn{
  flex-shrink:0;padding:12px 16px;
  font-size:12px;font-weight:700;
  background:none;border:none;color:var(--muted);
  cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-2px;
  transition:all .2s;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.nav-btn.active{color:var(--rose-d);border-bottom-color:var(--rose-d);}

/* ===== TAB ===== */
.tab{display:none;animation:up .2s ease;}
.tab.active{display:block;}
@keyframes up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ===== SECTION ===== */
.sec{padding:16px 16px 0;}
.sec-hd{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.sec-title{
  font-size:13px;font-weight:800;
  display:flex;align-items:center;gap:7px;
}
.sec-title::before{content:'';display:block;width:3px;height:15px;background:var(--rose-d);border-radius:2px;}

/* ===== CARD ===== */
.card{
  background:#fff;border-radius:var(--r);
  box-shadow:0 2px 12px rgba(58,42,48,.07);
  overflow:hidden;margin-bottom:10px;
}

/* ===== 予約カード ===== */
.res-card{
  padding:14px 16px;
  border-left:3px solid var(--rose);
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:10px;
}
.res-card.confirmed{border-left-color:var(--green);}
.res-card.cancelled{border-left-color:#ccc;opacity:.6;}
.res-left{}
.res-menu{font-size:15px;font-weight:800;margin-bottom:4px;}
.res-meta{font-size:11px;color:var(--muted);line-height:1.8;}
.res-meta strong{color:var(--ink);}
.res-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.status-badge{
  font-size:10px;font-weight:700;
  padding:3px 9px;border-radius:10px;
  background:var(--rose-l);color:var(--rose-d);
  white-space:nowrap;
}
.status-badge.confirmed{background:var(--green-l);color:#2e7d32;}
.status-badge.cancelled{background:#f5f5f5;color:#999;}
.res-actions{display:flex;gap:6px;}
.act-btn{
  font-size:10px;font-weight:700;
  padding:4px 10px;border-radius:8px;border:none;cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.act-btn.confirm{background:var(--green-l);color:#2e7d32;}
.act-btn.cancel{background:var(--red-l);color:var(--red);}
.act-btn:active{transform:scale(.94);}

/* 区切り線 */
.divider{height:1px;background:var(--border);margin:0 16px;}

/* ===== メニュー管理 ===== */
.menu-row{
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
  transition:background .15s;
  cursor:default;
}
.menu-row.dragging{
  opacity:.4;background:#faf7f8;
}
.menu-row.drag-over{
  background:var(--rose-l);
  border-top:2px solid var(--rose-d);
}
.drag-handle{
  font-size:16px;color:var(--border);
  cursor:grab;flex-shrink:0;
  user-select:none;touch-action:none;
  padding:4px 2px;
}
.drag-handle:active{cursor:grabbing;}
.menu-row-info{flex:1;}
.menu-row-name{font-size:14px;font-weight:800;margin-bottom:2px;}
.menu-row-meta{font-size:11px;color:var(--muted);}
/* 価格インライン編集 */
.menu-row-price{
  font-size:15px;font-weight:800;color:var(--rose-d);flex-shrink:0;
  cursor:pointer;border-bottom:1px dashed transparent;
  transition:border-color .15s;padding-bottom:1px;
}
.menu-row-price:hover{border-bottom-color:var(--rose-d);}
.price-input{
  width:90px;font-size:14px;font-weight:800;color:var(--rose-d);
  border:2px solid var(--rose);border-radius:6px;
  padding:3px 7px;font-family:inherit;
  background:#fff;text-align:right;
}
.price-input:focus{outline:none;}
.del-btn{
  width:28px;height:28px;border-radius:50%;
  background:var(--red-l);color:var(--red);
  border:none;cursor:pointer;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.del-btn:active{transform:scale(.9);}

/* 追加フォーム */
.add-form{
  padding:14px 16px;
  background:#faf7f8;
  border-top:1px solid var(--border);
}
.add-form-title{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:10px;letter-spacing:.05em;}
.add-row{display:grid;grid-template-columns:1fr 80px 70px;gap:8px;margin-bottom:8px;}
.add-input{
  padding:9px 11px;
  border:2px solid var(--border);border-radius:var(--rs);
  font-size:13px;font-family:inherit;background:#fff;color:var(--ink);
  -webkit-appearance:none;
}
.add-input:focus{outline:none;border-color:var(--rose);}
.add-btn{
  width:100%;padding:10px;
  background:linear-gradient(135deg,var(--rose),var(--rose-d));
  color:#fff;border:none;border-radius:var(--rs);
  font-size:13px;font-weight:800;cursor:pointer;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
}
.add-btn:active{transform:scale(.97);}

/* ===== クーポン管理 ===== */
.coupon-row{
  padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.coupon-info{}
.coupon-name{font-size:14px;font-weight:800;margin-bottom:3px;}
.coupon-detail{font-size:11px;color:var(--muted);}
/* トグルスイッチ */
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-track{
  position:absolute;inset:0;
  background:var(--border);border-radius:12px;
  cursor:pointer;transition:background .2s;
}
.toggle input:checked + .toggle-track{background:var(--green);}
.toggle-thumb{
  position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);
  transition:transform .2s;pointer-events:none;
}
.toggle input:checked ~ .toggle-thumb{transform:translateX(20px);}

/* ===== 返信テンプレ ===== */
.tmpl-base-row{padding:14px 16px;}
.tmpl-base-label{
  font-size:12px;font-weight:700;color:var(--muted);
  margin-bottom:8px;letter-spacing:.04em;
}
.tmpl-textarea{
  width:100%;padding:10px 12px;
  border:2px solid var(--border);border-radius:var(--rs);
  font-size:13px;font-family:inherit;color:var(--ink);
  background:#fff;resize:vertical;min-height:90px;line-height:1.7;
}
.tmpl-textarea:focus{outline:none;border-color:var(--rose);}
.tmpl-base-actions{
  display:flex;justify-content:flex-end;gap:8px;margin-top:8px;
}
.tmpl-copy-btn{
  padding:8px 14px;border-radius:var(--rs);border:2px solid var(--border);
  background:#fff;font-size:12px;font-weight:700;color:var(--muted);
  cursor:pointer;transition:all .15s;
  -webkit-tap-highlight-color:transparent;
}
.tmpl-copy-btn:hover{border-color:var(--rose);color:var(--rose-d);}
.tmpl-copy-btn.copied{border-color:var(--green);color:var(--green);background:var(--green-l);}
.custom-tmpl-card{
  background:#fff;border-radius:var(--r);
  box-shadow:0 2px 12px rgba(58,42,48,.07);
  margin-bottom:10px;overflow:hidden;
}
.custom-tmpl-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px 8px;
}
.custom-tmpl-title{font-size:13px;font-weight:800;}
.custom-tmpl-acts{display:flex;gap:6px;}
.custom-tmpl-body{
  font-size:12px;color:var(--muted);line-height:1.7;
  padding:0 16px 14px;white-space:pre-wrap;
}

/* ===== 過去予約トグル ===== */
.past-toggle{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;
  font-size:12px;font-weight:700;color:var(--muted);
  cursor:pointer;background:#faf7f8;
  -webkit-tap-highlight-color:transparent;
}
.past-toggle:hover{background:#f5f0f2;}
.past-arrow{font-size:10px;}

/* ===== サマリーカード ===== */
.summary-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  gap:10px;padding:16px;
}
.summary-item{
  background:#fff;border-radius:var(--rs);
  padding:14px 12px;text-align:center;
  box-shadow:0 2px 8px rgba(58,42,48,.06);
}
.summary-num{font-size:24px;font-weight:800;color:var(--rose-d);}
.summary-lbl{font-size:10px;color:var(--muted);margin-top:3px;}

/* ===== 空状態 ===== */
.empty{
  text-align:center;padding:32px 16px;
  font-size:12px;color:var(--muted);line-height:1.8;
}

/* ===== FAB風 追加ヒント ===== */
.hint{
  font-size:10px;color:var(--muted);
  padding:8px 16px 0;
  text-align:right;
}
</style>
</head>
<body>
<div class="layout">

<!-- HEADER -->
<div class="hd">
  <div class="hd-top">
    <div class="hd-name">💅 ネイルサロン 管理画面</div>
    <div class="hd-badge">ADMIN</div>
  </div>
  <div class="hd-sub" id="hd-date"></div>
</div>

<!-- スマホ用横ナビ -->
<div class="nav">
  <button class="nav-btn active" onclick="switchTab('reserve',this)">📋 予約一覧</button>
  <button class="nav-btn" onclick="switchTab('menu',this)">🍽 メニュー管理</button>
  <button class="nav-btn" onclick="switchTab('coupon',this)">🎁 クーポン管理</button>
  <button class="nav-btn" onclick="switchTab('template',this)">💬 返信テンプレ</button>
</div>

<!-- PC用2カラム -->
<div class="pc-cols">

  <!-- PC用サイドバー -->
  <div class="sidebar">
    <button class="sidebar-btn active" onclick="switchTab('reserve',this)">📋 予約一覧</button>
    <button class="sidebar-btn" onclick="switchTab('menu',this)">🍽 メニュー管理</button>
    <button class="sidebar-btn" onclick="switchTab('coupon',this)">🎁 クーポン管理</button>
    <button class="sidebar-btn" onclick="switchTab('template',this)">💬 返信テンプレ</button>
  </div>

  <!-- メインエリア -->
  <div class="main-area">

    <!-- TAB: 予約一覧 -->
    <div class="tab active" id="tab-reserve">
      <div class="summary-grid">
        <div class="summary-item">
          <div class="summary-num" id="sum-total">0</div>
          <div class="summary-lbl">全予約</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="sum-pending" style="color:var(--rose-d)">0</div>
          <div class="summary-lbl">未確定</div>
        </div>
        <div class="summary-item">
          <div class="summary-num" id="sum-confirmed" style="color:var(--green)">0</div>
          <div class="summary-lbl">確定済</div>
        </div>
      </div>
      <div class="sec">
        <div class="sec-hd">
          <div class="sec-title">予約一覧</div>
          <div style="display:flex;align-items:center;gap:12px;">
            <label style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;">
              <input type="checkbox" id="show-cancelled" style="accent-color:var(--muted);width:14px;height:14px;" onchange="renderReserves()">
              取消も表示
            </label>
            <label style="display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;">
              <input type="checkbox" id="check-all" style="accent-color:var(--green);width:14px;height:14px;" onchange="confirmAll(this.checked)">
              すべて確定
            </label>
          </div>
        </div>
        <div class="card" id="reserve-list"></div>
      </div>
    </div>

    <!-- TAB: メニュー管理 -->
    <div class="tab" id="tab-menu">
      <div class="sec">
        <div class="sec-hd">
          <div class="sec-title">メニュー一覧</div>
          <div class="hint">下のフォームから追加できます</div>
        </div>
        <div class="card">
          <div id="menu-list"></div>
          <div class="add-form">
            <div class="add-form-title">＋ メニューを追加</div>
            <div class="add-row">
              <input class="add-input" id="new-menu-name" placeholder="メニュー名">
              <input class="add-input" id="new-menu-price" placeholder="¥0,000">
              <input class="add-input" id="new-menu-min" placeholder="分" type="number">
            </div>
            <select class="add-input" id="new-menu-badge" style="margin-bottom:8px;">
              <option value="">バッジなし</option>
              <option value="人気No.1">人気No.1</option>
              <option value="おすすめ">おすすめ</option>
            </select>
            <button class="add-btn" onclick="addMenu()">追加する</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: クーポン管理 -->
    <div class="tab" id="tab-coupon">
      <div class="sec">
        <div class="sec-hd">
          <div class="sec-title">クーポン一覧</div>
        </div>
        <div class="card">
          <div id="coupon-list"></div>
          <div class="add-form">
            <div class="add-form-title">＋ クーポンを追加</div>
            <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:8px;">
              <input class="add-input" id="new-coupon-name"   placeholder="クーポン名（例：紹介割 500円OFF）">
              <input class="add-input" id="new-coupon-detail" placeholder="説明（例：お友達紹介のお客様に適用）">
            </div>
            <button class="add-btn" onclick="addCoupon()">追加する</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TAB: 返信テンプレ -->
    <div class="tab" id="tab-template">
      <!-- 基本テンプレ -->
      <div class="sec">
        <div class="sec-hd"><div class="sec-title">基本テンプレ</div></div>
        <div class="card">
          <div class="tmpl-base-row">
            <div class="tmpl-base-label">⏳ 未確定時の返信</div>
            <textarea class="tmpl-textarea" id="tmpl-pending"></textarea>
            <div class="tmpl-base-actions">
              <button class="tmpl-copy-btn" onclick="copyTmpl('tmpl-pending')">📋 コピー</button>
              <button class="add-btn" style="width:auto;padding:8px 16px;" onclick="saveTmplBase()">保存</button>
            </div>
          </div>
          <div class="divider"></div>
          <div class="tmpl-base-row">
            <div class="tmpl-base-label">✅ 確定時の返信</div>
            <textarea class="tmpl-textarea" id="tmpl-confirmed"></textarea>
            <div class="tmpl-base-actions">
              <button class="tmpl-copy-btn" onclick="copyTmpl('tmpl-confirmed')">📋 コピー</button>
              <button class="add-btn" style="width:auto;padding:8px 16px;" onclick="saveTmplBase()">保存</button>
            </div>
          </div>
        </div>
      </div>

      <!-- カスタムテンプレ -->
      <div class="sec" style="margin-top:4px;">
        <div class="sec-hd"><div class="sec-title">カスタムテンプレ</div></div>
        <div id="custom-tmpl-list"></div>
        <div class="card">
          <div class="add-form">
            <div class="add-form-title">＋ テンプレを追加</div>
            <input class="add-input" id="new-tmpl-title" placeholder="タイトル（例：キャンセル案内）" style="width:100%;margin-bottom:8px;">
            <textarea class="tmpl-textarea" id="new-tmpl-body" placeholder="返信文を入力…" style="height:80px;"></textarea>
            <button class="add-btn" onclick="addCustomTmpl()" style="margin-top:8px;">追加する</button>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /main-area -->
</div><!-- /pc-cols -->
</div><!-- /layout -->

<script>
// ===== 今日の日付 =====
const now  = new Date();
const days = ['日','月','火','水','木','金','土'];
document.getElementById('hd-date').textContent =
  `${now.getMonth()+1}/${now.getDate()}（${days[now.getDay()]}）の管理画面`;

// ===== デフォルトデータ（localStorageが空の初回だけ使う）=====
const DEFAULT_RESERVATIONS = [
  { id:1, menu:'ジェルネイル',    date:'2026-03-26', time:'11:00', duration:'60分',  note:'ピンク系希望',       status:'pending'   },
  { id:2, menu:'ジェル＋オフあり',date:'2026-03-26', time:'14:00', duration:'90分',  note:'',                   status:'pending'   },
  { id:3, menu:'スカルプ',        date:'2026-03-27', time:'13:00', duration:'120分', note:'長めにお願いしたい', status:'confirmed' },
  { id:4, menu:'ジェルネイル',    date:'2026-03-27', time:'15:30', duration:'60分',  note:'',                   status:'pending'   },
  { id:5, menu:'オフのみ',        date:'2026-03-25', time:'10:00', duration:'30分',  note:'',                   status:'confirmed' },
];
const DEFAULT_MENUS = [
  { id:1, name:'ジェルネイル',    price:'¥5,000', min:60,  badge:'人気No.1' },
  { id:2, name:'ジェル＋オフあり',price:'¥6,500', min:90,  badge:''         },
  { id:3, name:'スカルプ',        price:'¥9,000', min:120, badge:'おすすめ'  },
  { id:4, name:'オフのみ',        price:'¥2,000', min:30,  badge:''         },
];
const DEFAULT_COUPONS = [
  { id:1, name:'初回限定 20%OFF', detail:'初めてのお客様のみ',       active:true  },
  { id:2, name:'平日限定 10%OFF', detail:'月〜金のご来店に適用',     active:false },
  { id:3, name:'誕生月 無料オフ', detail:'誕生月のお客様はオフ無料', active:true  },
];

// ===== localStorage読み込み（なければデフォルトを書き込み）=====
function loadData(key, defaults) {
  const raw = localStorage.getItem(key);
  if (raw) return JSON.parse(raw);
  localStorage.setItem(key, JSON.stringify(defaults));
  return defaults;
}
function save(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

let reservations = loadData('reservations', DEFAULT_RESERVATIONS);
let menus        = loadData('menus',        DEFAULT_MENUS);
let coupons      = loadData('coupons',      DEFAULT_COUPONS);

// ===== 予約一覧 =====
function isPast(dateStr, timeStr) {
  // "2026-03-26" 形式と旧 "3/26" 形式の両方に対応
  let d;
  if (dateStr.includes('-')) {
    d = new Date(dateStr + 'T' + timeStr + ':00');
  } else {
    // 旧形式 "3/26" → 今年の日付として解釈
    const [m, dd] = dateStr.split('/').map(Number);
    const [h, min] = timeStr.split(':').map(Number);
    d = new Date(new Date().getFullYear(), m - 1, dd, h, min);
  }
  return d < new Date();
}

function fmtDate(dateStr) {
  // "2026-03-26" → "3/26"、旧形式 "3/26" はそのまま返す
  if (!dateStr.includes('-')) return dateStr;
  const d = new Date(dateStr + 'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function renderReserves() {
  const list         = document.getElementById('reserve-list');
  const showCancelled = document.getElementById('show-cancelled').checked;

  document.getElementById('sum-total').textContent     = reservations.length;
  document.getElementById('sum-pending').textContent   = reservations.filter(r=>r.status==='pending').length;
  document.getElementById('sum-confirmed').textContent = reservations.filter(r=>r.status==='confirmed').length;

  // 取消を除外（トグルOFFの場合）
  const filtered = reservations.filter(r => showCancelled || r.status !== 'cancelled');

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">予約はまだありません</div>';
    syncCheckAll(); return;
  }

  // 今日以降・過去に分類
  const upcoming = filtered.filter(r => !isPast(r.date, r.time));
  const past     = filtered.filter(r =>  isPast(r.date, r.time));

  function cardHTML(r) {
    return `
      <div class="res-card ${r.status}">
        <div class="res-left" style="flex:1;">
          <div class="res-menu">${r.menu}</div>
          <div class="res-meta">
            📅 <strong>${fmtDate(r.date)} ${r.time}</strong>　⏱ ${r.duration}
            ${r.note ? `<br>📝 ${r.note}` : ''}
          </div>
        </div>
        <div class="res-right">
          <div class="status-badge ${r.status}">${r.status==='confirmed'?'✅ 確定':r.status==='cancelled'?'✗ 取消':'⏳ 未確定'}</div>
          <div class="res-actions">
            ${r.status==='pending'   ? `<button class="act-btn confirm" onclick="confirmRes(${r.id})">確定</button>` : ''}
            ${r.status!=='cancelled' ? `<button class="act-btn cancel"  onclick="cancelRes(${r.id})">取消</button>` : ''}
          </div>
        </div>
      </div>`;
  }

  let html = '';

  // 今日以降
  if (upcoming.length) {
    html += upcoming.map((r,i) =>
      cardHTML(r) + (i < upcoming.length-1 ? '<div class="divider"></div>' : '')
    ).join('');
  } else {
    html += '<div class="empty" style="padding:16px;">今後の予約はありません</div>';
  }

  // 過去の予約（あれば折りたたみ）
  if (past.length) {
    html += `
      <div class="divider"></div>
      <div class="past-toggle" onclick="togglePast(this)">
        <span>過去の予約 ${past.length}件</span>
        <span class="past-arrow">▼</span>
      </div>
      <div class="past-wrap" style="display:none;">
        ${past.map((r,i) =>
          `<div style="opacity:.45;">${cardHTML(r)}</div>` +
          (i < past.length-1 ? '<div class="divider"></div>' : '')
        ).join('')}
      </div>`;
  }

  list.innerHTML = html;
  syncCheckAll();
}

function togglePast(el) {
  const wrap = el.nextElementSibling;
  const arrow = el.querySelector('.past-arrow');
  const isOpen = wrap.style.display !== 'none';
  wrap.style.display = isOpen ? 'none' : 'block';
  arrow.textContent = isOpen ? '▼' : '▲';
}

function syncCheckAll() {
  const allConfirmed = reservations.filter(r=>r.status!=='cancelled').every(r=>r.status==='confirmed');
  const cb = document.getElementById('check-all');
  if (cb) cb.checked = allConfirmed && reservations.length > 0;
}
function confirmAll(checked) {
  if (checked && confirm('仮予約をすべて確定しますか？')) {
    reservations.forEach(r => { if (r.status === 'pending') r.status = 'confirmed'; });
    save('reservations', reservations);
    renderReserves();
  } else {
    // キャンセルした場合はチェックを戻す
    document.getElementById('check-all').checked = false;
  }
}
function confirmRes(id) {
  const r = reservations.find(r=>r.id===id);
  if (r) { r.status='confirmed'; save('reservations',reservations); renderReserves(); }
}
function cancelRes(id) {
  const r = reservations.find(r=>r.id===id);
  if (r) { r.status='cancelled'; save('reservations',reservations); renderReserves(); }
}

// ===== メニュー管理 =====
function renderMenus() {
  const list = document.getElementById('menu-list');
  if (!menus.length) {
    list.innerHTML = '<div class="empty">メニューがありません</div>'; return;
  }
  list.innerHTML = menus.map((m,i) => `
    <div class="menu-row" draggable="true" data-id="${m.id}">
      <div class="drag-handle" title="ドラッグして並び替え">⠿</div>
      <div class="menu-row-info">
        <div class="menu-row-name">
          ${m.name}
          ${m.badge ? `<span style="font-size:9px;font-weight:700;background:var(--rose-d);color:#fff;border-radius:4px;padding:2px 6px;margin-left:6px;">${m.badge}</span>` : ''}
        </div>
        <div class="menu-row-meta">⏱ ${m.min}分</div>
      </div>
      <div class="menu-row-price" onclick="startPriceEdit(${m.id}, this)" title="クリックで編集">${m.price}</div>
      <select class="add-input" style="width:80px;padding:4px 6px;font-size:11px;" onchange="updateBadge(${m.id},this.value)">
        <option value=""         ${!m.badge            ?'selected':''}>なし</option>
        <option value="人気No.1" ${m.badge==='人気No.1'?'selected':''}>人気No.1</option>
        <option value="おすすめ" ${m.badge==='おすすめ' ?'selected':''}>おすすめ</option>
      </select>
      <button class="del-btn" onclick="delMenu(${m.id})">×</button>
    </div>
    ${i < menus.length-1 ? '<div class="divider"></div>' : ''}
  `).join('');
  initDnD();
}

// ===== 価格インライン編集 =====
function startPriceEdit(id, el) {
  const m = menus.find(m=>m.id===id);
  if (!m) return;
  const input = document.createElement('input');
  input.className = 'price-input';
  input.value = m.price;
  el.replaceWith(input);
  input.focus(); input.select();
  function commit() {
    const val = input.value.trim() || m.price;
    m.price = val;
    save('menus', menus);
    renderMenus();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { input.blur(); }
    if (e.key === 'Escape') { m.price = m.price; renderMenus(); }
  });
}

// ===== ドラッグ&ドロップ =====
let dragSrcId = null;

function initDnD() {
  const rows = document.querySelectorAll('.menu-row[draggable]');
  rows.forEach(row => {
    // PC: drag events
    row.addEventListener('dragstart', e => {
      dragSrcId = parseInt(row.dataset.id);
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging');
      document.querySelectorAll('.menu-row').forEach(r => r.classList.remove('drag-over'));
    });
    row.addEventListener('dragover', e => {
      e.preventDefault();
      document.querySelectorAll('.menu-row').forEach(r => r.classList.remove('drag-over'));
      row.classList.add('drag-over');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const targetId = parseInt(row.dataset.id);
      if (dragSrcId === targetId) return;
      const srcIdx = menus.findIndex(m=>m.id===dragSrcId);
      const tgtIdx = menus.findIndex(m=>m.id===targetId);
      const [moved] = menus.splice(srcIdx, 1);
      menus.splice(tgtIdx, 0, moved);
      save('menus', menus);
      renderMenus();
    });

    // スマホ: touch events（長押し→ドラッグ）
    let touchTimer = null, touchSrcId = null, clone = null;
    const handle = row.querySelector('.drag-handle');
    handle.addEventListener('touchstart', e => {
      touchTimer = setTimeout(() => {
        touchSrcId = parseInt(row.dataset.id);
        row.classList.add('dragging');
        // クローン作成
        clone = row.cloneNode(true);
        clone.style.cssText = `position:fixed;opacity:.7;pointer-events:none;z-index:9999;width:${row.offsetWidth}px;background:#fff;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);`;
        document.body.appendChild(clone);
      }, 400);
    }, {passive:true});
    handle.addEventListener('touchmove', e => {
      if (!clone) return;
      e.preventDefault();
      const t = e.touches[0];
      clone.style.left = (t.clientX - clone.offsetWidth/2) + 'px';
      clone.style.top  = (t.clientY - 30) + 'px';
      // ターゲット検出
      clone.style.display = 'none';
      const el = document.elementFromPoint(t.clientX, t.clientY);
      clone.style.display = '';
      const targetRow = el?.closest('.menu-row[draggable]');
      document.querySelectorAll('.menu-row').forEach(r=>r.classList.remove('drag-over'));
      if (targetRow) targetRow.classList.add('drag-over');
    }, {passive:false});
    handle.addEventListener('touchend', e => {
      clearTimeout(touchTimer);
      if (!clone) return;
      const t = e.changedTouches[0];
      clone.remove(); clone = null;
      row.classList.remove('dragging');
      document.querySelectorAll('.menu-row').forEach(r=>r.classList.remove('drag-over'));
      const el = document.elementFromPoint(t.clientX, t.clientY);
      const targetRow = el?.closest('.menu-row[draggable]');
      if (!targetRow || !touchSrcId) return;
      const targetId = parseInt(targetRow.dataset.id);
      if (touchSrcId === targetId) return;
      const srcIdx = menus.findIndex(m=>m.id===touchSrcId);
      const tgtIdx = menus.findIndex(m=>m.id===targetId);
      const [moved] = menus.splice(srcIdx, 1);
      menus.splice(tgtIdx, 0, moved);
      save('menus', menus);
      renderMenus();
      touchSrcId = null;
    });
  });
}
function updateBadge(id, val) {
  const m = menus.find(m=>m.id===id);
  if (m) { m.badge = val; save('menus', menus); renderMenus(); }
}
function addMenu() {
  const name  = document.getElementById('new-menu-name').value.trim();
  const price = document.getElementById('new-menu-price').value.trim();
  const min   = parseInt(document.getElementById('new-menu-min').value);
  const badge = document.getElementById('new-menu-badge').value;
  if (!name || !price || !min) { alert('名前・価格・時間を入力してください'); return; }
  menus.push({ id:Date.now(), name, price, min, badge });
  save('menus', menus);
  document.getElementById('new-menu-name').value  = '';
  document.getElementById('new-menu-price').value = '';
  document.getElementById('new-menu-min').value   = '';
  document.getElementById('new-menu-badge').value = '';
  renderMenus();
}
function delMenu(id) {
  const i = menus.findIndex(m=>m.id===id);
  if (i !== -1) { menus.splice(i,1); save('menus',menus); renderMenus(); }
}

// ===== クーポン管理 =====
function renderCoupons() {
  const list = document.getElementById('coupon-list');
  if (!coupons.length) {
    list.innerHTML = '<div class="empty">クーポンがありません</div>'; return;
  }
  list.innerHTML = coupons.map((c,i) => `
    <div class="coupon-row">
      <div class="coupon-info">
        <div class="coupon-name">${c.name}</div>
        <div class="coupon-detail">${c.detail}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
        <label class="toggle">
          <input type="checkbox" ${c.active?'checked':''} onchange="toggleCoupon(${c.id},this.checked)">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
        <button class="del-btn" onclick="delCoupon(${c.id})">×</button>
      </div>
    </div>
    ${i < coupons.length-1 ? '<div class="divider"></div>' : ''}
  `).join('');
}
function toggleCoupon(id, val) {
  const c = coupons.find(c=>c.id===id);
  if (c) { c.active=val; save('coupons',coupons); }
}
function addCoupon() {
  const name   = document.getElementById('new-coupon-name').value.trim();
  const detail = document.getElementById('new-coupon-detail').value.trim();
  if (!name) { alert('クーポン名を入力してください'); return; }
  coupons.push({ id:Date.now(), name, detail, active:true });
  save('coupons', coupons);
  document.getElementById('new-coupon-name').value   = '';
  document.getElementById('new-coupon-detail').value = '';
  renderCoupons();
}
function delCoupon(id) {
  const i = coupons.findIndex(c=>c.id===id);
  if (i !== -1) { coupons.splice(i,1); save('coupons',coupons); renderCoupons(); }
}

// ===== 返信テンプレ =====
const DEFAULT_TEMPLATES = {
  pendingMessage:
`ご予約ありがとうございます💅
○月○日 ○時 の【メニュー名】で承りました。
確認が取れましたらあらためてご連絡いたします。
少々お待ちください🙏`,
  confirmedMessage:
`ご予約の確定をお知らせいたします✅
○月○日 ○時 【メニュー名】
こちらで確定となります。
当日お気をつけてお越しください💅`,
  customTemplates: []
};

function loadTemplates() {
  const raw = localStorage.getItem('templates');
  if (raw) return JSON.parse(raw);
  localStorage.setItem('templates', JSON.stringify(DEFAULT_TEMPLATES));
  return { ...DEFAULT_TEMPLATES };
}
function saveTemplates(data) {
  localStorage.setItem('templates', JSON.stringify(data));
}

let templates = loadTemplates();

function renderTemplates() {
  // 基本テンプレをテキストエリアに反映
  document.getElementById('tmpl-pending').value   = templates.pendingMessage   || '';
  document.getElementById('tmpl-confirmed').value = templates.confirmedMessage || '';
  // カスタムテンプレ一覧
  const list = document.getElementById('custom-tmpl-list');
  if (!templates.customTemplates.length) {
    list.innerHTML = '<div class="empty" style="padding:12px 0;">カスタムテンプレはまだありません</div>';
    return;
  }
  list.innerHTML = templates.customTemplates.map(t => `
    <div class="custom-tmpl-card">
      <div class="custom-tmpl-head">
        <div class="custom-tmpl-title">${t.title}</div>
        <div class="custom-tmpl-acts">
          <button class="tmpl-copy-btn" id="copy-${t.id}" onclick="copyCustomTmpl(${t.id})">📋 コピー</button>
          <button class="del-btn" onclick="delCustomTmpl(${t.id})">×</button>
        </div>
      </div>
      <div class="custom-tmpl-body">${t.body}</div>
    </div>
  `).join('');
}

function saveTmplBase() {
  templates.pendingMessage   = document.getElementById('tmpl-pending').value;
  templates.confirmedMessage = document.getElementById('tmpl-confirmed').value;
  saveTemplates(templates);
  // 保存フィードバック
  const btn = event.currentTarget;
  const orig = btn.textContent;
  btn.textContent = '✅ 保存済';
  setTimeout(() => { btn.textContent = orig; }, 1200);
}

function addCustomTmpl() {
  const title = document.getElementById('new-tmpl-title').value.trim();
  const body  = document.getElementById('new-tmpl-body').value.trim();
  if (!title || !body) { alert('タイトルと返信文を入力してください'); return; }
  templates.customTemplates.push({ id: Date.now(), title, body });
  saveTemplates(templates);
  document.getElementById('new-tmpl-title').value = '';
  document.getElementById('new-tmpl-body').value  = '';
  renderTemplates();
}

function delCustomTmpl(id) {
  templates.customTemplates = templates.customTemplates.filter(t=>t.id!==id);
  saveTemplates(templates);
  renderTemplates();
}

function copyTmpl(elId) {
  const text = document.getElementById(elId).value;
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.currentTarget;
    btn.textContent = '✅ コピー済';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 コピー'; btn.classList.remove('copied'); }, 1500);
  });
}

function copyCustomTmpl(id) {
  const t = templates.customTemplates.find(t=>t.id===id);
  if (!t) return;
  navigator.clipboard.writeText(t.body).then(() => {
    const btn = document.getElementById('copy-'+id);
    if (!btn) return;
    btn.textContent = '✅ コピー済';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 コピー'; btn.classList.remove('copied'); }, 1500);
  });
}

// ===== タブ切替 =====
function switchTab(id, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn, .sidebar-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  // サイドバー・横ナビ両方を同期
  const allBtns = document.querySelectorAll('.nav-btn, .sidebar-btn');
  allBtns.forEach(b => {
    if (b.getAttribute('onclick') === `switchTab('${id}',this)`) b.classList.add('active');
  });
}

// ===== 初期化 =====
renderReserves();
renderMenus();
renderCoupons();
renderTemplates();
</script>
